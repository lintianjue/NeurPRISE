# configs/exp/train.yaml

defaults:
  - exp    # inherit the common settings
  - _self_

stage: "train"

train:
  max_epochs: 200
  patience: 10
  optimizer:
    lr: 6e-4
    weight_decay: 1e-2
  grad_clip: 10.0
  batch_size: ${data.batch_size}
  num_workers: ${data.num_workers}
  model_output_dir: ""

  teacher_mode: none
  device: cuda
  amp_dtype: bf16

  grad_debug: false
  log_every_n_steps: 500
