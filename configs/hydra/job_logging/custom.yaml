
version: 1
formatters:
  simple:
    (): src.utils.log_utils.RelativePathFormatter
    format: '[%(asctime)s][%(levelname)s] File "%(pathname)s", line %(lineno)d - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    formatter: simple
    filename: ${hydra.runtime.output_dir}/${python_name:${hydra:runtime.program}}.log
root:
  level: INFO
  handlers: [console, file]
disable_existing_loggers: false


