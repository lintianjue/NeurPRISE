name: vertex_cover
module: src.problems.vertex_cover.VertexCoverProblem

solver:
  exact: true
  time_limit: ${solver.time_limit}
  mip_gap: ${solver.mip_gap}
  threads: ${solver.threads}
  verbose: ${solver.verbose}
  prise_time_limit: ${solver.prise_time_limit}
  prise_verbose: ${solver.prise_verbose}

instance:
  n_nodes: 8
  n_scenarios: 10
  p_edge: 10
  p_select: 10

  # optional defaults for uniform generator etc.
  n_min_cost: 1
  n_max_cost: 100

  scenario_name: "uniform"
  scenario_generator:
    _target_: src.problems.scenario_generator.IidUniformScenarioGenerator
    n_min_cost: 1
    n_max_cost: 100

embed:
  node_feature_dim: 9
  det_feature_dim: 9


metrics:
  - obj
  - feas
  -
data:
  path: ${oc.env:NEURPRISE_INPUT_ROOT}/data/
  inst_spec_pattern: "inst_seed{seed}_cnt{instance_cnt}_n{n_nodes}_s{n_scenarios}_p{p_edge}_scen_{scenario_name}.pkl"
  inst_spec_label_pattern: "label_{label_type}_seed{seed}_cnt{instance_cnt}_n{n_nodes}_s{n_scenarios}_p{p_edge}_scen_{scenario_name}.pkl"
  # Which physical label file to READ. null = the undecorated name (or whatever
  # label.prise.output selects, unchanged). Set to consume a variant the labeller
  # does not produce -- e.g. "merged500" for the 500-record role-merged file built
  # by scripts/pipeline/merge_label_roles.py. See src/utils/label_roles.py.
  label_variant: null
