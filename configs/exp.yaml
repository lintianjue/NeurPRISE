# Global experiment config (Hydra-friendly)
defaults:
  - _self_
  - problem: vertex_cover
  - model: det_source_sce_mean
  - solver: base
  - losses: multilabel_bce_loss
  - override hydra/job_logging: custom


seed: 42
run_name: ${problem.name}_${now:%Y%m%d_%H%M%S}

data:
  instance_cnt: 100
  val_split: 0.1
  test_split: 0.1
  split_mode: ratio
  val_split_number: 0
  test_abs_split_number: 0
  train_split_number: 0
  batch_size: 32
  num_workers: 12
  limit: 0
  normalize: false


callbacks:
  checkpoint:
    monitor: val/obj
    mode: min
    save_top_k: 3

hydra:
  run:
    dir: ${oc.env:NEURPRISE_RUN_ROOT}/logs/${python_name:${hydra:runtime.program}}/${run_name}/r${oc.env:RANK,0}
  sweep:
    dir: ${oc.env:NEURPRISE_RUN_ROOT}/hydra_sweep

label:
  type: prise
  prise:
    k_ratio: 0.4
    # What the LABELLER writes: both | bigmilp | forward_trace. 02_prise_label.py
    # rejects anything else. Consumers also suffix the filename with it, so it
    # doubles as a read selector -- but to READ a variant the labeller does not
    # produce (e.g. merged500) use problem.data.label_variant, which takes
    # precedence and is not validated against the writer's vocabulary.
    output: both
    process_first_pct: null  # set e.g. 50 to only label first 50% (exclusive with process_last_pct)
    process_last_pct: null   # set e.g. 10 to only label last 10%  (exclusive with process_first_pct)
    # Explicit 0-based half-open index shard [index_start, index_end). Exclusive
    # with both pct knobs. Set both to run one shard of a parallel labeling job;
    # the output filename then carries a _shard{start}-{end} suffix and the
    # shards are recombined by scripts/pipeline/merge_label_shards.py.
    index_start: null
    index_end: null
    # Plateau cutoff of the forward-greedy labeler. eps_gain=0.0 with a large
    # stop_M runs to k_max with the cutoff disabled. Both null =>
    # _forward_with_trace's own defaults (eps_gain=0.0001, stop_M=1).
    forward_eps_gain: null
    forward_stop_M: null
    # Cheap-label knob B: MIP gap for the forward greedy's *inner* candidate solves
    # only (the big-MILP objective label keeps solver.mip_gap). Read defensively by
    # 02_prise_label.py:376-379, but it was never declared here, so it could only be
    # set with `+label.prise.forward_mip_gap=...`. Declared so it is a first-class
    # config key like every other knob. null => Gurobi default 1e-4, i.e. canonical.
    # Knob A is solver.prise_time_limit; it was already a declared key.
    forward_mip_gap: null
